name: Build Wheels

on:
  workflow_dispatch:
  push:
    branches: [cpp_port]
  pull_request:
    branches: [cpp_port]

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14]  # macos-14 = arm64 (Apple Silicon)
        python: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel==2.22.0 scikit-build-core pybind11

      - name: Build wheels
        env:
          CIBW_BUILD: "cp3*-*"
          CIBW_SKIP: "pp*, *musllinux*"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_TEST_SKIP: "*"
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: mmm-wheels-${{ matrix.os }}-py${{ matrix.python }}
          path: wheelhouse/*.whl
