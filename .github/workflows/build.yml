name: Build Wheels

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Operating system to build on (leave empty for all)"
        required: false
        default: ""
        type: choice
        options:
          - ""              # all OSes
          - ubuntu-latest
          - macos-14        # Apple Silicon (arm64)
          - macos-13        # Intel Mac
      python-version:
        description: "Python version to build for (leave empty for all)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"

jobs:
  build_wheels:
    name: Build wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.inputs.os != '' && format('["{0}"]', github.event.inputs.os) || '["ubuntu-latest", "macos-13", "macos-14"]') }}
        python: ${{ fromJSON(github.event.inputs.python-version != '' && format('["{0}"]', github.event.inputs.python-version) || '["3.8", "3.9", "3.10", "3.11", "3.12"]') }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel==2.22.0 scikit-build-core pybind11

      - name: Build wheels with cibuildwheel
        env:
          CIBW_BUILD: "cp3*-*"
          CIBW_SKIP: "pp*, *musllinux*"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_TEST_SKIP: "*"
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: mmm-wheels-${{ matrix.os }}-py${{ matrix.python }}
          path: wheelhouse/*.whl
